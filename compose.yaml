# Deux services :
# - worker : travail de fond (conservation des passations), aucune surface HTTP ;
# - collect : service de collecte du pilote (specs/IAM_V2_2/COLLECTE_RGPD.md).
#   Tant qu'il est en 'exposure: none' dans app.yaml, personne ne le joint.
#   L'ouverture publique passe par app-exposure.py, qui pose ensemble
#   app.yaml et les labels Traefik -- jamais de labels a la main.
# Les deux partagent le volume iam_data (base SQLite des passations).
services:
  worker:
    build:
      context: ./src
    restart: unless-stopped
    networks:
      - internal
    environment:
      APP_NAME: iam
      TZ: Europe/Paris
      WORKER_INTERVAL: "30"
      COLLECTE_FIN: ${COLLECTE_FIN:-}
    volumes:
      - state:/state
      - data:/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
          pids: 128
    healthcheck:
      # Le worker touche /tmp/heartbeat a chaque tour : le conteneur est sain
      # tant que ce fichier est recent. Le seuil doit rester superieur a deux
      # fois WORKER_INTERVAL. 'Sain' veut dire "la boucle tourne", pas "le
      # travail reussit" -- ca, ce sont les logs qui le disent.
      # Les '$$' sont des '$' : Docker Compose interprete un '$' seul.
      test: ["CMD", "sh", "-c", "[ $$(( $$(date +%s) - $$(stat -c %Y /tmp/heartbeat) )) -lt 180 ]"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 'docker stop' laisse 10 s avant le SIGKILL. Le worker s'arrete a la fin du
    # cycle en cours : si un cycle peut durer plus longtemps, augmenter ici.
    stop_grace_period: 30s

  collect:
    build:
      context: ./src/collect
    restart: unless-stopped
    networks:
      - internal
    environment:
      TZ: Europe/Paris
      COLLECT_PORT: "8080"
      COLLECT_ORIGIN: https://s-geffroy.github.io
      # Dernier jour de collecte (AAAA-MM-JJ). Vide : collecte fermee.
      COLLECTE_FIN: ${COLLECTE_FIN:-}
      # Version de la notice et du consentement ; a changer avec leur texte.
      CONSENT_VERSION: "1"
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
          pids: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s

networks:
  internal:
    name: iam-internal
    external: true

volumes:
  state:
    name: iam_state
  data:
    name: iam_data

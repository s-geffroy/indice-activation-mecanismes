# Politique d'exposition de l'application. Volontairement minimal :
# tout le reste (images, ports, volumes) vit dans compose.yaml.
#
# Un worker ne repond a personne : 'none' est sa place naturelle, et appctl
# refusera un routeur Traefik ou un reseau edge tant qu'il y reste.
name: iam

services:
  worker:
    exposure: none
  # Service de collecte : ferme tant que l'exposition publique n'est pas
  # decidee. L'ouvrir avec app-exposure.py (voir COLLECTE_RGPD.md), jamais
  # en editant ce fichier ou les labels a la main.
  collect:
    exposure: none
